apiVersion: apps/v1
kind: Deployment

metadata:
 name: saturday
  namespace: development

spec:
 replicas: 2

selector:
 matchLabels:
  app: saturday

template:
 metadata:
  labels:
   app: saturday

spec:
 containers:
  - name: saturday-container
    image: saturdaysamdi/saturday-demo:1.0

ports:
 - containerport: 80

env:
 - name: APP_NAME
    valuefrom:
      configMapKeyRef:
       name: saturday-config
        key: APP_ENV

 - name: BACKEND_URL
valuefrom:
  configMapKeyRef:
name: saturday-config
 key: BACKEND_URL




