apiVersion: autoscaling/v2
kind: horizontalPodAutoscaler

metadata:
  name: nginx-hpa

spec:
  scaleTargetRef:
  apiVersion: apps/v1
  kind: Deployment
  name: nginx

minReplicas: 2
maxReplicas: 10

 metrics:
  - type: Resource
    resource:
      name: cpu
      target:
       type: Utilization
       averageUtilzation: 70
