services:

  frontend:
    build: ./frontend
    container_name: saturday_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: saturday_backend
    ports:
      - "5000:5000"
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_USER: saturday
      DB_PASSWORD: password123
      DB_NAME: saturday
    depends_on:
      - database

  database:
    image: postgres:16-alpine
    container_name: saturday-database
    environment:
      POSTGRES_USER: saturday
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: saturday
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
